name: Build Control
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none
  pages: write
  id-token: write

jobs:
  # linux:      { uses: ./.github/workflows/linux.yml, secrets: inherit }
  # debian:     { uses: ./.github/workflows/debian.yml, secrets: inherit }
  # windows:    { uses: ./.github/workflows/windows.yml, secrets: inherit }
  # macos:      { uses: ./.github/workflows/macos.yml, secrets: inherit }
  # macos_intel: { uses: ./.github/workflows/macos_intel.yml, secrets: inherit }
  # freebsd:    { uses: ./.github/workflows/freebsd.yml, secrets: inherit }
  # msix:         { uses: ./.github/workflows/msix.yml, secrets: inherit }
  pages:        { uses: ./.github/workflows/pages.yml, secrets: inherit }
