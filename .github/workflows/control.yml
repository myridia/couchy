name: Build Control
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - debian
          - windows
          - macos
          - macos_intel          
          - msix
          - freebsd

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  debian:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'debian'
    uses: ./.github/workflows/debian.yml
    secrets: inherit

  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  macos_intel:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos_intel'
    uses: ./.github/workflows/macos_intel.yml
    secrets: inherit    

  freebsd:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'freebsd'
    uses: ./.github/workflows/freebsd.yml
    secrets: inherit

  msix:
    needs: [windows]
    if: always() && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'msix')
    uses: ./.github/workflows/msix.yml
    secrets: inherit
